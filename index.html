<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 6 Save the animals! - Talk with Takashi & Yuko</title>
<style>
:root{
  --bg1:#c8f1ff; --bg2:#fff4c2;
  --pink:#ff7eb6; --blue:#4db8ff; --green:#5fd68a; --yellow:#ffd23f; --red:#ff4d5e; --ink:#33406b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Yu Gothic",system-ui,sans-serif;color:var(--ink)}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;display:flex;justify-content:center;padding:12px}
#app{width:100%;max-width:720px;display:flex;flex-direction:column;gap:12px}
h1{margin:4px 0;text-align:center;font-size:clamp(20px,5vw,30px);color:#ff6a3d;text-shadow:2px 2px 0 #fff}
h1 small{display:block;font-size:.55em;color:var(--ink);text-shadow:none}
.screen{display:none;flex-direction:column;gap:12px;align-items:center}
.screen.active{display:flex}
.card-row{display:flex;gap:14px;width:100%;justify-content:center;flex-wrap:wrap}
.char-card{flex:1 1 220px;max-width:300px;background:#fff;border:5px solid var(--blue);border-radius:28px;padding:14px;text-align:center;cursor:pointer;font:inherit;color:inherit;box-shadow:0 8px 0 rgba(77,184,255,.35);transition:transform .15s}
.char-card.yuko{border-color:var(--pink);box-shadow:0 8px 0 rgba(255,126,182,.35)}
.char-card:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.char-card img{width:100%;max-width:200px;aspect-ratio:1/1;object-fit:cover;background:#f1f8ff;border-radius:50%;display:block;margin:0 auto 8px}
.char-card .name{font-size:22px;font-weight:bold}
.char-card .desc{font-size:14px;margin-top:4px}
.panel{width:100%;background:#fff;border-radius:28px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.progress{display:flex;justify-content:center;gap:10px}
.dot{width:18px;height:18px;border-radius:50%;background:#dfe6f5;border:3px solid #fff;box-shadow:0 0 0 2px #dfe6f5}
.dot.done{background:var(--green);box-shadow:0 0 0 2px var(--green)}
.dot.now{background:var(--yellow);box-shadow:0 0 0 2px var(--yellow)}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.char-wrap{width:min(46vw,200px)}
#charImg{width:100%;aspect-ratio:1/1;object-fit:cover;background:#fff;border-radius:50%;border:5px solid var(--blue);display:block;animation:float 2.6s ease-in-out infinite}
#charImg.yuko{border-color:var(--pink)}
#charImg.speaking{animation:bounce .45s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-14px) scale(.97,1.04)}70%{transform:translateY(0) scale(1.04,.96)}}
.bubble{position:relative;width:100%;min-height:110px;background:#fff;border:4px solid var(--yellow);border-radius:26px;padding:14px 16px;font-size:clamp(18px,4.6vw,24px);line-height:1.45;font-weight:bold}
.bubble::before{content:"";position:absolute;top:-22px;left:50%;margin-left:-14px;border:14px solid transparent;border-bottom-color:var(--yellow)}
.badge{display:inline-block;margin-bottom:6px;padding:2px 14px;border-radius:999px;color:#fff;font-size:16px;background:var(--green)}
.badge.good{background:var(--blue)} .badge.try{background:#ff9f43} .badge.pardon{background:#9aa5c4}
.me{margin-top:8px;font-size:15px;font-weight:normal;color:#6a74a0}
#statusBar{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:999px;background:#e8edf8;font-weight:bold;font-size:clamp(14px,3.8vw,18px);transition:background .2s,box-shadow .2s,color .2s}
#statusBar.listening{background:var(--red);color:#fff;animation:glow 1s ease-in-out infinite}
#statusBar.speaking{background:var(--blue);color:#fff}
@keyframes glow{0%,100%{box-shadow:0 0 6px 2px rgba(255,77,94,.5)}50%{box-shadow:0 0 22px 8px rgba(255,77,94,.9)}}
#mic{font-size:26px;display:inline-block}
#statusBar.listening #mic{animation:pulse .8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
.btn{border:none;border-radius:999px;padding:14px 28px;font:inherit;font-size:18px;font-weight:bold;color:#fff;background:var(--green);box-shadow:0 6px 0 #3aa564;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #3aa564}
.btn.sub{background:#9aa5c4;box-shadow:0 5px 0 #7882a3;font-size:15px;padding:10px 20px}
.btn.orange{background:#ff8a3d;box-shadow:0 6px 0 #d96a1f}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#textFallback{display:none;width:100%;gap:8px}
#textFallback input{flex:1;font:inherit;font-size:18px;padding:10px 14px;border-radius:999px;border:3px solid var(--blue);min-width:0}
#note{font-size:13px;text-align:center;color:#6a74a0}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

.ja{margin-top:10px;padding-top:8px;border-top:2px dashed #ffe58a;font-size:clamp(14px,3.6vw,18px);font-weight:bold;color:#c75b00;line-height:1.55;white-space:pre-line}
.ja:empty{display:none}
#saidBox{display:none;width:100%;background:#fff;border:4px solid var(--green);border-radius:22px;padding:10px 14px}
#saidBox.show{display:block}
#saidBox .lbl{font-size:13px;color:#2e9a5a;font-weight:bold}
#saidText{font-size:clamp(18px,4.8vw,26px);font-weight:bold;min-height:1.5em;word-break:break-word}
#saidText .ph{color:#aab3cf;font-weight:normal;font-size:.62em}
.btn.big{font-size:20px;padding:16px 30px}
.btn.blue{background:var(--blue);box-shadow:0 6px 0 #2b8fd1}
</style>
</head>

  "What can you do about deforestation?",
  "What can you do about air pollution?"
];
const TURNS = 3;
const ENDING = "Excellent! We can save the earth and animals together! You are a great hero!";
const ENDING_JA = "すばらしい！ わたしたちは、地球と動物たちを いっしょに すくえるよ！ あなたは すごい ヒーローだよ！";
const PARDON = "Pardon? Can you say it again? Start with We can...";
const PARDON_JA = "もういちど いってくれるかな？ 「We can...」から はじめてね。";

/* ---------- Elements ---------- */
const $ = id => document.getElementById(id);
const screens = { start:$("startScreen"), game:$("gameScreen"), end:$("endScreen") };
const charImg=$("charImg"), bubbleText=$("bubbleText"), badge=$("badge"), jaText=$("jaText");
const saidBox=$("saidBox"), saidText=$("saidText");
const statusBar=$("statusBar"), statusText=$("statusText");
const doneBtn=$("doneBtn"), retryBtn=$("retryBtn"), nextBtn=$("nextBtn"), skipBtn=$("skipBtn"), homeBtn=$("homeBtn");
const textFallback=$("textFallback"), textInput=$("textInput");

/* ---------- State ---------- */
let current=null, order=[], turn=0, failCount=0, session=0;
let phase="idle";            // idle | speaking | listening | feedback
let recognition=null, committed="", live="", stamps=[], micBlocked=false;
let voices=[];
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const synth = window.speechSynthesis;

/* ---------- Sound: start-of-listening "fon" ---------- */
let actx=null;
function ensureAudio(){
  try{
    if(!actx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) actx=new AC(); }
    if(actx && actx.state==="suspended") actx.resume();
  }catch(e){}
}
function beep(){
  return new Promise(res=>{
    try{
      ensureAudio(); if(!actx) return res();
      const t=actx.currentTime;
      [[520,880,0.30],[1040,1760,0.08]].forEach(([f0,f1,vol])=>{
        const o=actx.createOscillator(), g=actx.createGain();
        o.type="sine";
        o.frequency.setValueAtTime(f0,t);
        o.frequency.exponentialRampToValueAtTime(f1,t+0.18);
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(vol,t+0.03);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.38);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t+0.4);
      });
      setTimeout(res,450);
    }catch(e){ res(); }
  });
}

/* ---------- Voices / speech ---------- */
function loadVoices(){ voices = synth ? synth.getVoices() : []; }
if(synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }

function pickVoice(gender){
  const en = voices.filter(v => /^en/i.test(v.lang));
  if(!en.length) return null;
  const male = /(male(?!.*female)|david|daniel|alex|fred|mark|james|george|guy|tom|ryan|oliver|arthur|aaron|rishi)/i;
  const female = /(female|samantha|zira|karen|victoria|susan|hazel|moira|tessa|aria|jenny|allison|ava|kate|serena|fiona|google us english)/i;
  const re = gender==="male" ? male : female;
  return en.find(v=>re.test(v.name)) || en.find(v=>/en[-_]US/i.test(v.lang)) || en[0];
}

function speak(text){
  return new Promise(resolve=>{
    if(!synth){ setTimeout(resolve, 1200); return; }
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = current.rate;
    u.pitch = current.pitch;
    const v = pickVoice(current.gender);
    if(v){ u.voice = v; u.lang = v.lang; }
    let done=false;
    const finish=()=>{ if(done) return; done=true; clearTimeout(guard); charImg.classList.remove("speaking"); resolve(); };
    const guard = setTimeout(finish, Math.max(4000, text.length*140/ current.rate));
    u.onstart = ()=>charImg.classList.add("speaking");
    u.onend = finish; u.onerror = finish;
    charImg.classList.add("speaking");
    synth.speak(u);
  });
}

/* ---------- UI helpers ---------- */
function show(name){
  screens.start.classList.toggle("active", name==="start");
  screens.game.classList.toggle("active", name==="game"||name==="end");
  screens.end.classList.toggle("active", name==="end");
  homeBtn.style.display = name==="end" ? "none" : "";
}
function setStatus(mode,text){ statusBar.className = mode || ""; statusText.textContent = text; }
function setBubble(text,badgeKind){
  bubbleText.textContent = text;
  badge.innerHTML = "";
  if(badgeKind){
    const b=document.createElement("span");
    const map={great:["","⭐ Great! すごい！"],good:["good","👍 Good! いいね！"],try:["try","💪 Try! がんばれ！"],pardon:["pardon","🤔 Pardon?"]};
    b.className="badge "+map[badgeKind][0]; b.textContent=map[badgeKind][1]; badge.appendChild(b);
  }
}
function setJa(t){ jaText.textContent = t || ""; }
function updateProgress(){
  [...$("progress").children].forEach((d,i)=>{ d.className="dot"+(i<turn?" done":(i===turn?" now":"")); });
}
function typingMode(){ return !SR || micBlocked; }
function setButtons(mode){
  const vis=(el,on)=>{ el.style.display = on ? "inline-block" : "none"; };
  const listening = mode==="listening", feedback = mode==="feedback";
  vis(doneBtn, listening && !typingMode());
  retryBtn.textContent = feedback ? "🔄 もういちど こたえる / Answer again" : "🔄 やりなおす / Try again";
  vis(retryBtn, (listening && !typingMode()) || feedback);
  nextBtn.textContent = (turn>=TURNS-1) ? "🎉 おわりへ / Finish ▶" : "▶ つぎへ / Next";
  vis(nextBtn, feedback);
  vis(skipBtn, listening && (failCount>=2 || micBlocked));
}
function renderSaid(){
  const t=(committed+" "+live).trim();
  saidBox.classList.add("show");
  if(t){ saidText.textContent=t; }
  else { saidText.innerHTML='<span class="ph">はなすと ここに でるよ / Your words will appear here</span>'; }
}
function hideSaid(){ saidBox.classList.remove("show"); }

/* ---------- Evaluation (English + Japanese) ---------- */
function evaluate(raw){
  const t = raw.toLowerCase();
  const has = re => re.test(t);
  let en, ja, level="good";
  if(has(/\b(garbage|trash|litter|rubbish|waste|pick up|clean)/)){
    en="Great! Picking up garbage keeps our town and the sea clean.";
    ja="すばらしい！ ごみを ひろうと、まちも うみも きれいになるよ。"; level="great";
  } else if(has(/\b(recycle|recycling|reduce|reuse|plastic|bag|bottle)/)){
    en="Wonderful! Recycling and reducing plastic helps the animals a lot.";
    ja="すてき！ リサイクルや プラスチックを へらすことは、どうぶつたちを たくさん たすけるよ。"; level="great";
  } else if(has(/\b(water|energy|electricity|light|shower|tap|river|sea|ocean)/) || has(/\bsave\b/)){
    en="Nice! Saving water and energy is a smart action for our planet.";
    ja="いいね！ みずや エネルギーを たいせつにするのは、ちきゅうのための かしこい こうどうだよ。"; level="great";
  } else if(has(/\b(tree|trees|plant|plants|forest|paper|wood)/)){
    en="Cool! Planting trees gives animals a home and fresh air.";
    ja="かっこいい！ きを うえると、どうぶつの すみかと きれいな くうきが うまれるよ。"; level="great";
  } else if(has(/\b(walk|bike|bicycle|train|bus|car)/)){
    en="Good idea! Walking or biking makes the air clean.";
    ja="いい かんがえ！ あるいたり じてんしゃに のったりすると、くうきが きれいになるよ。"; level="great";
  } else {
    en="Thank you for your idea.";
    ja="アイデアを ありがとう。";
  }
  if(/\bcan\b/.test(t)){
    en += " You used 'can' very well!";
    ja += "\n「can」を とても じょうずに つかえたね！";
  } else {
    en += " Next time, try saying 'We can' at the beginning!";
    ja += "\nつぎは、さいしょに「We can」と いってみよう！";
    if(level==="good") level="try";
  }
  return { en, ja, level };
}

/* ---------- Speech recognition (manual "Done" button) ---------- */
function fullText(){ return (committed+" "+live).trim(); }

function stopRecognition(){
  const r=recognition; recognition=null;
  if(r){ r.onstart=r.onresult=r.onerror=r.onend=null; try{ r.abort(); }catch(e){} }
}

async function beginListening(){
  const my=session;
  phase="listening";
  committed=""; live=""; stamps=[];
  textFallback.style.display="none"; textInput.value="";
  renderSaid();
  setButtons("listening");
  setStatus("","じゅんび… / Get ready…");
  await beep();                         // "fon" start sound
  if(my!==session || phase!=="listening") return;
  if(typingMode()){
    textFallback.style.display="flex";
    setStatus("listening","にゅうりょく してね / Type your answer");
    textInput.focus();
    return;
  }
  startRecognition(my);
}

function startRecognition(my){
  stopRecognition();
  const rec = new SR();
  recognition = rec;
  rec.lang="en-US"; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
  rec.onstart = ()=>{
    if(my!==session||rec!==recognition) return;
    setStatus("listening","🔴 はなして！ おわったら ✅ / Speak now! Press Done");
  };
  rec.onresult = e=>{
    if(my!==session||rec!==recognition) return;
    let s="";
    for(let k=0;k<e.results.length;k++) s+=e.results[k][0].transcript+" ";
    live = s.trim();
    renderSaid();
  };
  rec.onerror = e=>{
    if(my!==session||rec!==recognition) return;
    if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture"){
      stopRecognition(); micBlocked=true;
      textFallback.style.display="flex";
      setStatus("","マイクが つかえません。タイプで こたえてね / Mic blocked. Please type.");
      setButtons("listening");
    }
  };
  rec.onend = ()=>{
    if(my!==session||rec!==recognition) return;
    committed=(committed+" "+live).trim(); live="";
    if(phase!=="listening") return;
    const now=Date.now(); stamps=stamps.filter(t=>now-t<10000); stamps.push(now);
    if(stamps.length>6){ setStatus("","マイクが とまったよ。🔄 を おしてね / Press Try again"); return; }
    setTimeout(()=>{ if(my===session && phase==="listening" && rec===recognition) startRecognition(my); },200);
  };
  try{ rec.start(); }catch(e){ setStatus("","🔄 を おしてね / Press Try again"); }
}

/* ---------- Turn flow ---------- */
function doneSpeaking(){
  if(phase!=="listening") return;
  const text = (typingMode() && textInput.value.trim()) ? textInput.value.trim() : fullText();
  stopRecognition();
  if(!text){ handleNoSpeech(); return; }
  handleAnswer(text);
}

async function handleNoSpeech(){
  const my=session;
  failCount++;
  phase="speaking";
  setButtons("none");
  setStatus("speaking","きいているよ… / "+current.name+" is talking");
  setBubble(PARDON,"pardon"); setJa(PARDON_JA);
  saidText.innerHTML='<span class="ph">きこえなかったよ / I could not hear you</span>';
  await speak(PARDON);
  if(my!==session) return;
  beginListening();
}

async function handleAnswer(text){
  const my=session;
  failCount=0;
  textFallback.style.display="none"; textInput.value="";
  committed=text; live=""; renderSaid();          // keep the heard text on screen
  const ev = evaluate(text);
  phase="feedback";
  setBubble(ev.en, ev.level); setJa(ev.ja);
  setButtons("feedback");
  setStatus("speaking","おへんじ ちゅう / "+current.name+" is talking");
  await speak(ev.en);
  if(my!==session) return;
  setStatus("","よんだら「つぎへ」を おしてね / Read it, then press Next");
}

function advance(){
  session++; stopRecognition(); if(synth) synth.cancel();
  charImg.classList.remove("speaking");
  failCount=0; turn++; updateProgress();
  if(turn>=TURNS) ending(); else askQuestion();
}
function goNext(){ if(phase==="feedback") advance(); }

function retry(){
  if(phase!=="listening" && phase!=="feedback") return;
  session++; stopRecognition(); if(synth) synth.cancel();
  charImg.classList.remove("speaking");
  setBubble(QUESTIONS[order[turn]],null); setJa("");
  beginListening();
}

async function askQuestion(){
  const my=session;
  phase="speaking";
  updateProgress();
  setButtons("none"); hideSaid(); setJa("");
  setStatus("speaking","しつもん ちゅう / "+current.name+" is asking");
  setBubble(QUESTIONS[order[turn]],null);
  await speak(QUESTIONS[order[turn]]);
  if(my!==session) return;
  beginListening();
}

async function ending(){
  const my=session;
  phase="speaking";
  setButtons("none"); hideSaid();
  textFallback.style.display="none";
  setBubble(ENDING,"great"); setJa(ENDING_JA);
  setStatus("speaking","やったね！ / Well done!");
  startConfetti(); show("end");
  await speak(ENDING);
  if(my!==session) return;
  setStatus("","おわり / The End");
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function start(key){
  ensureAudio();                         // unlock sound on user tap
  current = CHARS[key];
  session++;
  order = shuffle(QUESTIONS.map((_,i)=>i)).slice(0,TURNS);
  turn=0; failCount=0; micBlocked=false;
  charImg.src = document.querySelector('[data-char="'+key+'"] img').getAttribute("src");
  charImg.className = current.cls;
  show("game");
  updateProgress(); setButtons("none"); hideSaid(); setJa("");
  phase="speaking";
  const intro = "Hello! I'm "+current.name+". Let's save the animals!";
  setBubble(intro,null);
  setStatus("speaking","あいさつ / Hello!");
  const my=session;
  speak(intro).then(()=>{ if(my===session) askQuestion(); });
}

function reset(){
  session++; phase="idle";
  stopRecognition();
  if(synth) synth.cancel();
  charImg.classList.remove("speaking");
  stopConfetti();
  textFallback.style.display="none";
  hideSaid(); setJa("");
  show("start");
}

/* ---------- Events ---------- */
document.querySelectorAll(".char-card").forEach(b=>b.addEventListener("click",()=>start(b.dataset.char)));
homeBtn.addEventListener("click",reset);
$("againBtn").addEventListener("click",reset);
doneBtn.addEventListener("click",doneSpeaking);
retryBtn.addEventListener("click",retry);
nextBtn.addEventListener("click",goNext);
skipBtn.addEventListener("click",()=>{ if(phase==="listening") advance(); });
function sendText(){ if(phase==="listening") doneSpeaking(); }
$("textSend").addEventListener("click",sendText);
textInput.addEventListener("keydown",e=>{ if(e.key==="Enter") sendText(); });

/* ---------- Confetti ---------- */
const cv=$("confetti"), ctx=cv.getContext("2d");
let parts=[], raf=null;
function resize(){ cv.width=innerWidth; cv.height=innerHeight; }
addEventListener("resize",resize); resize();
function startConfetti(){
  stopConfetti();
  const colors=["#ff7eb6","#4db8ff","#5fd68a","#ffd23f","#ff8a3d","#b388ff"];
  parts=Array.from({length:160},()=>({
    x:Math.random()*cv.width, y:-Math.random()*cv.height,
    w:6+Math.random()*8, h:8+Math.random()*10,
    c:colors[Math.floor(Math.random()*colors.length)],
    vy:2+Math.random()*4, vx:-1.5+Math.random()*3,
    r:Math.random()*6.28, vr:-.2+Math.random()*.4
  }));
  const loop=()=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{
      p.x+=p.vx+Math.sin(p.y/40); p.y+=p.vy; p.r+=p.vr;
      if(p.y>cv.height+20){ p.y=-20; p.x=Math.random()*cv.width; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    raf=requestAnimationFrame(loop);
  };
  loop();
}
function stopConfetti(){ if(raf) cancelAnimationFrame(raf); raf=null; ctx.clearRect(0,0,cv.width,cv.height); }
})();
</script>
